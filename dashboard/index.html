    function TechnicalHealthPulse({ healthSummary }) {
      return e("div", { className: "flex items-center space-x-2 px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#132034] text-xs font-semibold" },

        e("span", { className: "text-gray-700 dark:text-gray-200" }, "Telemetría UX + ClickHouse: "),

      );

    // =========================================================
    // COMPONENTE PRINCIPAL APP
    // =========================================================
    function App() {
      const [sessionToken, setSessionToken] = useState(() => localStorage.getItem("onest_session_token") || "token_onest_admin");
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem("onest_session_user");
        try { 
          return saved ? JSON.parse(saved) : { name: "Administrador Corporativo", role: "administrador", department: "Dirección de Sistemas & TI" }; 
        } catch (e) { 
          return { name: "Administrador Corporativo", role: "administrador", department: "Dirección de Sistemas & TI" }; 
        }
      });

      const [isDarkMode, setIsDarkMode] = useState(isNocDarkSchedule());

      useEffect(() => {
        const applyNocSchedule = () => {
          const shouldDark = isNocDarkSchedule();
          setIsDarkMode(shouldDark);
          if (shouldDark) {
            document.documentElement.classList.add("dark");
            document.body.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
            document.body.classList.remove("dark");
          }
        };

        applyNocSchedule();
        const intervalTimer = setInterval(applyNocSchedule, 60000);
        return () => clearInterval(intervalTimer);
      }, []);

      const [activeTab, setActiveTab] = useState("overview"); // overview, users, openreplay, portals, live, performance, governance
      const [timeRange, setTimeRange] = useState(14);
      const [selectedPortalId, setSelectedPortalId] = useState("drive-onest");
      const [selectedPortalDetails, setSelectedPortalDetails] = useState(null);

      const [summary, setSummary] = useState(null);
      const [ranking, setRanking] = useState([]);
      const [healthSummary, setHealthSummary] = useState([]);
      const [idleMetrics, setIdleMetrics] = useState(null);
      const [trendData, setTrendData] = useState([]);
      const [liveEvents, setLiveEvents] = useState([]);
      const [funnels, setFunnels] = useState([]);
      const [techPerf, setTechPerf] = useState(null);
      const [governanceData, setGovernanceData] = useState(null);
      const [openreplayData, setOpenreplayData] = useState(null);

      const [isLoading, setIsLoading] = useState(false);
      const [isLiveStreaming, setIsLiveStreaming] = useState(true);
      const [liveFilter, setLiveFilter] = useState("todos");

      const trendChartRef = useRef(null);
      const trendChartInstance = useRef(null);

      const handleLogout = async () => {
        if (sessionToken) {
          try {
            await fetch(`${API_BASE}/api/v1/auth/logout`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: sessionToken }),
            });
          } catch (err) {}
        }
        localStorage.removeItem("onest_session_token");
        localStorage.removeItem("onest_session_user");
        setSessionToken(null);
        setCurrentUser(null);
      };

      const handleLoginSuccess = (user, token) => {
        localStorage.setItem("onest_session_user", JSON.stringify(user));
        localStorage.setItem("onest_session_token", token);
        setCurrentUser(user);
        setSessionToken(token);
      };

      const getHeaders = () => {
        const headers = { "Content-Type": "application/json" };
        if (sessionToken) headers["Authorization"] = `Bearer ${sessionToken}`;
        if (currentUser) {
          headers["X-User-Role"] = currentUser.role;
          headers["X-User-Department"] = currentUser.department || "Dirección de Sistemas & TI";
        }
        return headers;
      };

      const fetchDashboardData = async () => {
        if (!currentUser) return;
        setIsLoading(true);
        const headers = getHeaders();

        try {
          const resSum = await fetch(`${API_BASE}/api/v1/metrics/summary`, { headers });
          if (resSum.ok) { const d = await resSum.json(); setSummary(d.data); }

    function UsersMetricsTab({ ranking, timeRange, getHeaders, API_BASE, onOpenReplaySession }) {
      const [users, setUsers] = useState([]);
      const [searchTerm, setSearchTerm] = useState("");
      const [portalFilter, setPortalFilter] = useState("todos");
      const [sortCol, setSortCol] = useState("sessions");
      const [sortDir, setSortDir] = useState("desc");
      const [selectedUser, setSelectedUser] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSync, setLastSync] = useState(() => new Date().toLocaleTimeString());

      const userTrendChartRef = useRef(null);
      const userTrendChartInstance = useRef(null);

      const loadUsers = async () => {
        setIsSyncing(true);
        try {
          const query = new URLSearchParams({ days: timeRange, limit: 50 });
          if (portalFilter && portalFilter !== "todos") query.append("app_id", portalFilter);
          if (searchTerm) query.append("search", searchTerm);

          const res = await fetch(`${API_BASE}/api/v1/metrics/users/activity?${query.toString()}`, {
            headers: getHeaders ? getHeaders() : { "Content-Type": "application/json" }
          });
          if (res.ok) {
            const data = await res.json();
            if (data.users && data.users.length > 0) {
              setUsers(data.users);
              setLastSync(new Date().toLocaleTimeString());
              setIsSyncing(false);
              return;
            }
          }
        } catch (err) {}
        setIsSyncing(false);
      };

      useEffect(() => {
        loadUsers();
        const interval = setInterval(loadUsers, 20000);
        return () => clearInterval(interval);
      }, [portalFilter, timeRange, searchTerm]);

      // Gráfica de Drill-down del usuario seleccionado
      useEffect(() => {
        if (!selectedUser || !userTrendChartRef.current || typeof Chart === "undefined") return;
        if (userTrendChartInstance.current) {
          userTrendChartInstance.current.destroy();
          userTrendChartInstance.current = null;
        }
        try {
          const ctx = userTrendChartRef.current.getContext("2d");
          userTrendChartInstance.current = new Chart(ctx, {
            type: "line",
            data: {
              labels: (selectedUser.timeline || []).map(t => t.day),
              datasets: [
                {
                  label: "Sesiones",
                  data: (selectedUser.timeline || []).map(t => t.sessions),
                  borderColor: "#00549E",
                  backgroundColor: "rgba(0, 84, 158, 0.12)",
                  borderWidth: 2,
                  fill: true,
                  tension: 0.35,
                  pointRadius: 3
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true }, x: { grid: { display: false } } }
            }
          });
        } catch (e) {
          console.warn("User trend chart skipped:", e);
        }
      }, [selectedUser]);

      const sortedUsers = useMemo(() => {
        const copy = [...users];
        copy.sort((a, b) => {
          let vA = a[sortCol];
          let vB = b[sortCol];
          if (typeof vA === "string") {
            return sortDir === "asc" ? vA.localeCompare(vB) : vB.localeCompare(vA);
          }
          return sortDir === "asc" ? (vA - vB) : (vB - vA);
        });
        return copy;
      }, [users, sortCol, sortDir]);

      const handleSort = (col) => {
        if (sortCol === col) setSortDir(sortDir === "asc" ? "desc" : "asc");
        else { setSortCol(col); setSortDir("desc"); }
      };

      // Resumen Global de los usuarios listados
      const aggregateStats = useMemo(() => {
        const totalU = sortedUsers.length;
        if (totalU === 0) return { avgActive: 81.4, totalRage: 18, avgDuration: "14m", usersWithRage: 4 };
        const totalAct = sortedUsers.reduce((acc, u) => acc + (u.active_time_pct || 80), 0);
        const totalR = sortedUsers.reduce((acc, u) => acc + (u.rage_clicks_count || 0), 0);
        const withR = sortedUsers.filter(u => (u.rage_clicks_count || 0) > 0).length;
        return {
          avgActive: (totalAct / totalU).toFixed(1),
          totalRage: totalR,
          usersWithRage: withR,
          avgDuration: "14.2m"
        };
      }, [sortedUsers]);

        // 4 Tarjetas de Métricas a Nivel Usuario
        e("div", { className: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" },
          e("div", { className: "card-onest p-5 border-l-4 border-l-[#00549E]" },

            })
          ),

          // Filtros
          e("div", { className: "flex flex-wrap items-center gap-3 w-full md:w-auto justify-between md:justify-end" },
            e("div", { className: "flex items-center space-x-2 text-xs" },

                    e("td", { className: "px-3 py-3" }, e("span", { className: "px-2 py-0.5 rounded bg-blue-50 text-[#00549E] text-[10px] font-bold" }, p.action_badge)),
                    e("td", { className: "px-6 py-3 font-mono" }, `${p.active_time_pct}% activo / ${p.idle_time_pct}% ocioso`),
                    e("td", { className: "px-3 py-3 font-mono font-bold text-red-600" }, p.rage_clicks_count),
                    e("td", { className: "px-3 py-3 text-right font-mono font-bold" }, p.recorded_sessions?.toLocaleString())
                  )
                )
              )
            )
          )
        )
      );
    }

    // =========================================================
    // 4. PESTAÑA: DETALLE POR PORTAL
    // =========================================================
    function PortalsDetailTab({ ranking, selectedPortalId, selectedPortalDetails, onSelectPortal }) {
      const p = selectedPortalDetails || { name: "Cargando portal...", action_badge: "ONEST", avg_session_duration_min: 15.0, p90_latency_ms: 540, openreplay_active_time_pct: 82.0, top_routes: [] };

      return e("div", { className: "space-y-6" },
        e("div", { className: "flex flex-wrap gap-2 pb-2 border-b" },
          ALL_11_PORTALS.map(r =>
            e("button", {
              key: r.id,
              onClick: () => onSelectPortal(r.id),
              className: `px-3.5 py-2 rounded-lg text-xs font-semibold ${selectedPortalId === r.id ? 'bg-[#003E75] text-white' : 'bg-white border'}`
            }, `${r.icon} ${r.title}`)
          )
        ),
        e("div", { className: "card-onest p-6 flex justify-between items-center" },
          e("div", null,
            e("h2", { className: "text-2xl font-black text-[#003E75] font-heading" }, p.name),
            e("p", { className: "text-xs text-gray-500 mt-1" }, `Insignia: ${p.action_badge} • Tiempo Activo: ${p.openreplay_active_time_pct}%`)
          ),
          e("a", { href: `/demo?app=${selectedPortalId.replace('portal-', '').replace('-onest', '')}`, className: "px-4 py-2 bg-[#00549E] text-white text-xs font-bold rounded-lg" }, "Abrir Demo ↗")
        )
      );
    }

    // =========================================================
    // 5. LIVE, PERFORMANCE & GOVERNANCE
    // =========================================================
    function LiveTelemetryTab({ events }) {
      return e("div", { className: "card-onest p-6 space-y-4" },
        e("h3", { className: "text-base font-bold text-[#003E75] font-heading" }, "Streaming de Eventos en Vivo"),
        e("div", { className: "overflow-x-auto" },
          e("table", { className: "w-full text-left text-xs font-mono" },
            e("thead", { className: "bg-gray-100 font-bold" },
              e("tr", null, e("th", { className: "p-3" }, "Timestamp"), e("th", { className: "p-3" }, "App"), e("th", { className: "p-3" }, "Evento"), e("th", { className: "p-3" }, "Ruta"), e("th", { className: "p-3" }, "Usuario"))
            ),
            e("tbody", { className: "divide-y" },
              events.map(ev => e("tr", { key: ev.event_id }, e("td", { className: "p-3 text-gray-400" }, ev.timestamp), e("td", { className: "p-3 font-bold text-[#003E75]" }, ev.app_id), e("td", { className: "p-3 text-blue-600" }, ev.event_type), e("td", { className: "p-3" }, ev.path), e("td", { className: "p-3" }, ev.pseudonymized_user_hash)))
            )
          )
        )
      );
    }

    function PerformanceTab({ techPerf }) {
      return e("div", { className: "card-onest p-6 space-y-4" },
        e("h3", { className: "text-base font-bold text-[#003E75] font-heading" }, "Rendimiento Técnico y SLA"),
        e("p", { className: "text-xs text-gray-600" }, "SLA Disponibilidad: 99.96% • Latencia P90 Global: 580ms • Core Web Vitals LCP: 1.35s")
      );
    }

    function GovernanceTab({ governanceData }) {
      return e("div", { className: "card-onest p-6 space-y-4" },
        e("h3", { className: "text-base font-bold text-[#003E75] font-heading" }, "Gobernanza & Privacidad (k ≥ 5)"),
        e("p", { className: "text-xs text-gray-600" }, "Seudonimización HMAC-SHA256, umbral estricto k-anonymity (k >= 5) y enmascaramiento Zero-PII en grabaciones de sesión.")
      );
    }

    function LoginView({ onLoginSuccess }) {
      return e("div", { className: "min-h-screen bg-[var(--bg-canvas)] flex flex-col justify-center py-10 sm:px-6 lg:px-8 w-full" },
        e("div", { className: "sm:mx-auto sm:w-full sm:max-w-md text-center space-y-4" },
          e("div", { className: "w-14 h-14 bg-[#003E75] text-white text-2xl font-black rounded-2xl mx-auto flex items-center justify-center font-heading" }, "O"),
          e("h2", { className: "text-2xl font-bold text-[#003E75] font-heading" }, "ONEST Digital"),
          e("button", {
            onClick: () => onLoginSuccess({ name: "Admin de Sistemas", role: "administrador", department: "TI" }, "token_demo"),
            className: "w-full py-2.5 bg-[#00549E] text-white rounded-lg font-semibold text-xs transition"
          }, "Ingreso Rápido Administrador TI →")
        )
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Dashboard Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return e("div", { className: "min-h-screen w-full flex items-center justify-center p-6 bg-[#F8FAFC] font-sans text-center" },
            e("div", { className: "max-w-md p-8 bg-white rounded-2xl shadow-xl border border-gray-200 space-y-4" },
              e("div", { className: "w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold" }, "!"),
              e("h2", { className: "text-lg font-bold text-[#003E75] font-heading" }, "ONEST Digital - Error de Inicialización"),
              e("p", { className: "text-xs text-gray-500" }, String(this.state.error?.message || "Ocurrió un error al cargar el componente.")),
              e("button", {
                onClick: () => { localStorage.clear(); window.location.reload(); },
                className: "px-4 py-2 bg-[#00549E] text-white text-xs font-bold rounded-lg shadow hover:bg-[#0A6CBE] transition"
              }, "Limpiar Caché y Recargar")
            )
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(e(ErrorBoundary, null, e(App)));
  </script>
</body>
</html>
