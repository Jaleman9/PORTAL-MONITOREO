  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            onest: {
              blue: {
                900: "#003E75",
                700: "#00549E",
                500: "#1677BD",

  <style>
    :root {
      /* ========================================================
         ONEST DIGITAL DESIGN SYSTEM v1.0 - TOKENS
         ======================================================== */
      --onest-blue-900: #003E75;
      --onest-blue-700: #00549E;
      --onest-blue-500: #1677BD;
      --onest-blue-100: #EAF3FA;

      --onest-green-700: #2B9138;
      --onest-green-500: #39B54A;
      --onest-green-100: #EAF7EC;

      /* Escala de Grises Completa */
      --gray-950: #20252B;
      --gray-700: #475467;
      --gray-500: #667085;
      --gray-300: #D0D5DD;
      --gray-200: #E1E6EB;
      --gray-100: #F2F4F7;
      --gray-50: #F8FAFC;
      --white: #FFFFFF;

      /* Colores Semánticos */
      --success: #22A447;
      --warning: #F59E0B;
      --danger: #D92D20;
      --info: #1677BD;
      --neutral: #667085;

      /* Radios */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;

      /* Superficies Modo Claro (70% Neutros, 20% Azul, 10% Verde) */
      --bg-canvas: #F5F7F9;
      --bg-surface: #FFFFFF;
      --bg-surface-subtle: #F8FAFC;
      --bg-sidebar: #003E75;
      --border-color: #E1E6EB;
      --text-primary: #20252B;
      --text-secondary: #667085;
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.05);
    }

    /* Superficies Modo Oscuro (Turnos Nocturnos NOC: 20:00 - 06:00) */
    html.dark, body.dark {
      --bg-canvas: #0B1220;
      --bg-surface: #1B2A41;
      --bg-surface-subtle: #132034;
      --bg-sidebar: #09101B;
      --border-color: #2D3E59;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;

      --gray-950: #F1F5F9;
      --gray-700: #CBD5E1;
      --gray-500: #94A3B8;
      --gray-300: #334155;
      --gray-200: #2D3E59;
      --gray-100: #1B2A41;
      --gray-50: #132034;

      --onest-blue-100: #1A365D;
      --onest-green-100: #0F381E;
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Montserrat', Arial, sans-serif;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--onest-green-500);
      box-shadow: 0 0 0 0 rgba(57, 181, 74, 0.7);
      animation: pulsing 1.8s infinite;
    }

    @keyframes pulsing {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(57, 181, 74, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(57, 181, 74, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(57, 181, 74, 0); }
    }

    .border-subtle { border: 1px solid var(--border-color); }
    
    .card-onest {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      transition: all 0.2s ease;
    }
    .card-onest:hover {
      border-color: #CBD5E1;
      box-shadow: 0 4px 12px -2px rgba(0, 62, 117, 0.06);
    }
    .dark .card-onest:hover {
      border-color: #475569;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.3);
    }

    /* Ítem activo del Sidebar según especificación de Design System (borde verde de 3px) */
    .sidebar-item-active {
      background-color: var(--onest-blue-700);
      color: #FFFFFF;
      border-left: 3px solid var(--onest-green-500);
      font-weight: 600;
    }
    .dark .sidebar-item-active {
      background-color: #1E3A5F;
      border-left: 3px solid var(--onest-green-500);
      color: #FFFFFF;
    }

    /* Scrollbar personalizada sobria */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-canvas); }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
</head>
<body class="min-h-screen flex">
  <div id="root" class="min-h-screen flex-1 flex"></div>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useRef, useMemo } = React;
    const API_BASE = window.location.origin;

    // Configuración de Horario Nocturno NOC (20:00 a 06:00)
    const NOC_DARK_START_HOUR = 20;
    const NOC_DARK_END_HOUR = 6;

    function isNocDarkSchedule() {
      const hour = new Date().getHours();
      return hour >= NOC_DARK_START_HOUR || hour < NOC_DARK_END_HOUR;
    }

    // Íconos SVG reutilizables de alta resolución
    const Icons = {

        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M13 10V3L4 14h7v7l9-11h-7z" })

        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" })
      ),

      ),
      ShieldCheck: () => e("svg", { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" })
      ),
      Layers: () => e("svg", { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" })
      ),
      Lock: () => e("svg", { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" })
      ),
      LogOut: () => e("svg", { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" })
      ),
      Download: () => e("svg", { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" })
      ),
      Refresh: () => e("svg", { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" })
      ),
      Search: () => e("svg", { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" })
      ),
      ChevronRight: () => e("svg", { className: "w-4 h-4", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M9 5l7 7-7 7" })
      ),
      ArrowUp: () => e("svg", { className: "w-3 h-3 inline", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2.5, d: "M5 10l7-7m0 0l7 7m-7-7v18" })
      ),
      ArrowDown: () => e("svg", { className: "w-3 h-3 inline", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2.5, d: "M19 14l-7 7m0 0l-7-7m7 7V3" })
      ),
      Close: () => e("svg", { className: "w-5 h-5", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
        e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M6 18L18 6M6 6l12 12" })
      )
    };

    // ==========================================
    // COMPONENTE: PULSE DE SALUD EN EL HEADER
    // ==========================================
    function TechnicalHealthPulse({ healthSummary }) {
      const [isOpen, setIsOpen] = useState(false);

      const worstStatus = useMemo(() => {
        if (!healthSummary || healthSummary.length === 0) {
          return { color: "green", text: "Todo operativo", dotClass: "bg-[#39B54A]" };
        }
        const hasRed = healthSummary.some(s => s.status === "red");
        if (hasRed) return { color: "red", text: "Falla detectada", dotClass: "bg-red-500" };
        const hasYellow = healthSummary.some(s => s.status === "yellow");
        if (hasYellow) return { color: "amber", text: "Atención requerida", dotClass: "bg-amber-500" };
        return { color: "green", text: "Todo operativo", dotClass: "bg-[#39B54A]" };
      }, [healthSummary]);

      const services = [
        {
          name: "Collector Service",
          endpoint: "FastAPI :8000",
          statusLabel: "Ingesta Edge (0 dropped)",
          color: "bg-[#39B54A]"
        },
        {
          name: "Message Queue",
          endpoint: "RabbitMQ :5672",
          statusLabel: "0 lag de mensajes",
          color: "bg-[#39B54A]"
        },
        {
          name: "Analytics Engine",
          endpoint: "ClickHouse :8123",
          statusLabel: worstStatus.color === "red" ? "Latencia elevada" : "MergeTree activo",
          color: worstStatus.dotClass
        }
      ];

      return e("div", { className: "relative", onMouseLeave: () => setIsOpen(false) },
        e("button", {
          type: "button",
          onClick: () => setIsOpen(!isOpen),
          onMouseEnter: () => setIsOpen(true),
          className: "flex items-center space-x-2 bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 px-3 py-1.5 rounded-full border border-gray-200 dark:border-gray-700 text-xs transition cursor-pointer shadow-sm"
        },
          e("span", { className: `w-2 h-2 rounded-full ${worstStatus.dotClass} ${worstStatus.color === 'green' ? 'pulse-dot' : ''}` }),
          e("span", { className: "font-semibold text-gray-700 dark:text-gray-200" }, worstStatus.text),
          e("svg", { className: "w-3 h-3 text-gray-400 ml-0.5", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
            e("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M19 9l-7 7-7-7" })
          )
        ),

        // Popover Dropdown con detalle individual de Collector, Queue y Engine
        isOpen && e("div", {
          className: "absolute right-0 mt-2 w-72 bg-white dark:bg-[#1B2A41] rounded-xl shadow-xl border border-gray-200 dark:border-[#2D3E59] p-3.5 z-50 text-xs"
        },
          e("div", { className: "font-bold text-gray-900 dark:text-white pb-2 mb-2 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center" },
            e("span", { className: "font-heading" }, "Salud de Infraestructura Core"),
            e("span", { className: "text-[10px] font-mono text-gray-400" }, "Telemetría")
          ),
          e("div", { className: "space-y-2.5" },
            services.map(srv =>
              e("div", { key: srv.name, className: "flex items-center justify-between" },
                e("div", { className: "flex items-center space-x-2 overflow-hidden" },
                  e("span", { className: `w-2 h-2 rounded-full flex-shrink-0 ${srv.color}` }),
                  e("div", { className: "truncate" },
                    e("div", { className: "font-semibold text-gray-800 dark:text-gray-200 leading-tight truncate" }, srv.name),
                    e("div", { className: "text-[10px] text-gray-400 font-mono" }, srv.endpoint)
                  )
                ),
                e("span", { className: "text-[10px] font-semibold text-gray-500 dark:text-gray-400 text-right flex-shrink-0" }, srv.statusLabel)
              )
            )
          ),
          e("div", { className: "mt-3 pt-2 border-t border-gray-100 dark:border-gray-700 flex justify-between items-center text-[10px] text-gray-400" },
            e("span", null, "Portales Web Monitoreados:"),
            e("span", { className: "font-bold text-[#39B54A]" }, `${(healthSummary || []).filter(h => h.status === 'green').length} Saludables`)
          )
        )
      );
    }

    // ==========================================
    // APLICACIÓN PRINCIPAL (REACT)
    // ==========================================
    function App() {
      // Sesión activa (autenticación)
      const [sessionToken, setSessionToken] = useState(() => localStorage.getItem("onest_session_token"));
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem("onest_session_user");
        try { return saved ? JSON.parse(saved) : null; } catch (e) { return null; }
      });

      // Modo Oscuro Automático (Turnos NOC: 20:00 - 06:00)
      const [isDarkMode, setIsDarkMode] = useState(isNocDarkSchedule());

      useEffect(() => {
        const applyNocSchedule = () => {
          const shouldDark = isNocDarkSchedule();
          setIsDarkMode(shouldDark);
          if (shouldDark) {
            document.documentElement.classList.add("dark");
            document.body.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
            document.body.classList.remove("dark");
          }
        };

        applyNocSchedule();
        const intervalTimer = setInterval(applyNocSchedule, 60000); // Chequeo cada 1 min
        window.addEventListener("focus", applyNocSchedule);
        document.addEventListener("visibilitychange", applyNocSchedule);

        return () => {
          clearInterval(intervalTimer);
          window.removeEventListener("focus", applyNocSchedule);
          document.removeEventListener("visibilitychange", applyNocSchedule);
        };
      }, []);

      // Estados de visualización
      const [activeTab, setActiveTab] = useState("overview"); // overview, portals, live, performance, governance
      const [timeRange, setTimeRange] = useState(14); // 7, 14, 30, 90 días
      const [selectedPortalId, setSelectedPortalId] = useState("portal-clientes");
      const [selectedPortalDetails, setSelectedPortalDetails] = useState(null);

      // Estados de datos de telemetría
      const [summary, setSummary] = useState(null);
      const [ranking, setRanking] = useState([]);
      const [healthSummary, setHealthSummary] = useState([]);
      const [idleMetrics, setIdleMetrics] = useState(null);
      const [trendData, setTrendData] = useState([]);
      const [liveEvents, setLiveEvents] = useState([]);
      const [funnels, setFunnels] = useState([]);
      const [techPerf, setTechPerf] = useState(null);
      const [governanceData, setGovernanceData] = useState(null);

      const [isLoading, setIsLoading] = useState(false);
      const [isLiveStreaming, setIsLiveStreaming] = useState(true);
      const [liveFilter, setLiveFilter] = useState("todos");

      // Referencias de Chart.js
      const trendChartRef = useRef(null);
      const trendChartInstance = useRef(null);
      const hourlyChartRef = useRef(null);
      const hourlyChartInstance = useRef(null);
      const deviceChartRef = useRef(null);
      const deviceChartInstance = useRef(null);
      const browserChartRef = useRef(null);
      const browserChartInstance = useRef(null);

      // Cerrar sesión
      const handleLogout = async () => {
        if (sessionToken) {
          try {
            await fetch(`${API_BASE}/api/v1/auth/logout`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: sessionToken }),
            });
          } catch (err) {}
        }
        localStorage.removeItem("onest_session_token");
        localStorage.removeItem("onest_session_user");
        setSessionToken(null);
        setCurrentUser(null);
      };

      // Iniciar sesión exitosa
      const handleLoginSuccess = (user, token) => {
        localStorage.setItem("onest_session_user", JSON.stringify(user));
        localStorage.setItem("onest_session_token", token);
        setCurrentUser(user);
        setSessionToken(token);
      };

      // Fetch headers con Token Bearer o Fallback de Rol
      const getHeaders = () => {
        const headers = { "Content-Type": "application/json" };
        if (sessionToken) {
          headers["Authorization"] = `Bearer ${sessionToken}`;
        }
        if (currentUser) {
          headers["X-User-Role"] = currentUser.role;
          headers["X-User-Department"] = currentUser.department || "Dirección de Sistemas & TI";
        }
        return headers;
      };

      // Cargar datos del dashboard
      const fetchDashboardData = async () => {
        if (!currentUser) return;
        setIsLoading(true);
        const headers = getHeaders();

        try {
          // 1. Resumen Ejecutivo
          const resSum = await fetch(`${API_BASE}/api/v1/metrics/summary`, { headers });
          if (resSum.ok) {
            const d = await resSum.json();
            setSummary(d.data);
          }

          // 2. Ranking de Adopción
          const resRank = await fetch(`${API_BASE}/api/v1/metrics/adoption-ranking`, { headers });
          if (resRank.ok) {
            const d = await resRank.json();
            setRanking(d.ranking || []);
          }

          // 3. Semáforo de Salud
          const resHealth = await fetch(`${API_BASE}/api/v1/metrics/health-traffic-light`, { headers });
          if (resHealth.ok) {
            const d = await resHealth.json();
            setHealthSummary(d.health_summary || []);
          }

          // 4. Cuentas Inactivas
          const resIdle = await fetch(`${API_BASE}/api/v1/metrics/idle-accounts?threshold_days=30`, { headers });
          if (resIdle.ok) {
            const d = await resIdle.json();
            setIdleMetrics(d.metrics);
          }

          // 5. Tendencia temporal
          const resTrend = await fetch(`${API_BASE}/api/v1/metrics/dau-mau?days=${timeRange}`, { headers });
          if (resTrend.ok) {
            const d = await resTrend.json();
            setTrendData(d.trend || []);
          }

          // 6. Performance Técnico
          const resPerf = await fetch(`${API_BASE}/api/v1/metrics/technical-performance`, { headers });
          if (resPerf.ok) {
            const d = await resPerf.json();
            setTechPerf(d.performance);
          }

          // 7. Funnels de Proceso
          const resFun = await fetch(`${API_BASE}/api/v1/metrics/funnels`, { headers });

            setFunnels(d.funnels || []);

            if (resGov.ok) {

              setGovernanceData(d);

          if (res.ok) {

        try {
          const res = await fetch(`${API_BASE}/api/v1/metrics/live-telemetry?limit=25`, { headers: getHeaders() });
          if (res.ok) {

            setLiveEvents(d.events || []);

    // ==========================================
    function LoginView({ onLoginSuccess }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [errorMsg, setErrorMsg] = useState("");
      const [loading, setLoading] = useState(false);
      const [demoUsers, setDemoUsers] = useState([]);

      useEffect(() => {
        fetch(`${API_BASE}/api/v1/auth/demo-users`)
          .then(r => r.json())
          .then(d => setDemoUsers(d))
          .catch(() => {});
      }, []);

      const submitLogin = async (loginEmail, loginPwd, quickRole = null) => {
        setLoading(true);
        setErrorMsg("");
        try {
          const res = await fetch(`${API_BASE}/api/v1/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: loginEmail || email,
              password: loginPwd !== undefined ? loginPwd : password,
              quick_role: quickRole
            })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Fallo en autenticación");
          }

          const data = await res.json();
          onLoginSuccess(data.user, data.access_token);
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

                  })
                ),
                e("div", null,
                  e("label", { className: "block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1 uppercase tracking-wider" }, "Contraseña"),

    // ==========================================
    // COMPONENTE: ACTIVIDAD DETALLADA POR USUARIO (SEUDÓNIMA)
    // ==========================================
    function UserActivitySubTab({ selectedPortalId, timeRange, getHeaders, ranking, onSelectPortal, API_BASE }) {
      const [users, setUsers] = useState([]);
      const [searchTerm, setSearchTerm] = useState("");
      const [portalFilter, setPortalFilter] = useState(selectedPortalId || "todos");
      const [sortCol, setSortCol] = useState("sessions");
      const [sortDir, setSortDir] = useState("desc");
      const [selectedUser, setSelectedUser] = useState(null);
      const [lastSync, setLastSync] = useState(() => new Date().toLocaleTimeString());
      const [isSyncing, setIsSyncing] = useState(false);

      const drillChartRef = useRef(null);
      const drillChartInstance = useRef(null);

      // Generador de respaldo de usuarios con k-anonimato garantizado
      const generateFallbackUsers = (pFilter, days, term) => {
        const apps = [
          "crm-ventas", "portal-clientes", "portal-proveedores",
          "portal-colaborador", "portal-comercial", "portal-soporte-ti",
          "erp-portal", "portal-rrhh", "portal-auditoria"
        ];
        const routesMap = {
          "crm-ventas": ["/oportunidades/pipeline", "/clientes/cartera", "/cotizaciones/activas", "/reportes/cierre"],
          "portal-clientes": ["/rastreo/guias", "/pedidos/seguimiento", "/notificaciones/status", "/descargas/comprobante"],
          "portal-proveedores": ["/facturas/carga-xml", "/ordenes-compra/consulta", "/pagos/calendario", "/certificados/sat"],
          "portal-colaborador": ["/recibos-nomina", "/solicitud-vacaciones", "/tramites/constancias", "/beneficios/consulta"],
          "portal-comercial": ["/cotizador/envios", "/tarifas/cobertura", "/solicitud/contacto", "/catalogo/servicios"],
          "portal-soporte-ti": ["/tickets/crear", "/tickets/mis-solicitudes", "/base-conocimiento", "/inventario/equipos"],
          "erp-portal": ["/inventario/stock", "/ordenes/compra", "/almacen/entradas", "/embarques/salidas"],
          "portal-rrhh": ["/nomina/recibos", "/asistencia/turnos", "/incidencias/reporte", "/expedientes/personal"],
          "portal-auditoria": ["/auditorias/logs", "/cumplimiento/k-anon", "/alertas/seguridad", "/reportes/descargas"],
        };
        const devicesList = ["Desktop Windows", "MacBook Pro", "Mobile Android", "iPhone iOS"];
        const browsersList = ["Google Chrome", "Microsoft Edge", "Mozilla Firefox", "Apple Safari"];
        const mult = Math.max(1, days / 14);
        const targetPortal = pFilter && pFilter !== "todos" ? pFilter.trim() : null;
        const count = targetPortal ? 24 : 36;
        const res = [];

        for (let i = 0; i < count; i++) {
          const portal = targetPortal ? targetPortal : apps[i % apps.length];
          const hex = ((i * 1234567 + 0x4A1F) & 0xFFFF).toString(16).padStart(4, "0").toUpperCase();
          const code = `USR-${hex}`;

          const sess = Math.round((14 + (i * 9) % 50) * mult);
          const pv = Math.round(sess * (3.8 + (i % 5) * 0.7));
          const secs = i * 420 + (i % 7) * 110;
          let rel = secs < 3600 ? `hace ${Math.max(2, Math.floor(secs / 60))}m` : (secs < 86400 ? `hace ${Math.floor(secs / 3600)}h` : `hace ${Math.floor(secs / 86400)}d`);
          const diff = ((i * 13) % 41) - 15;
          const timeline = [];
          for (let d = 0; d < Math.min(days, 14); d++) {
            timeline.push({ day: `D-${Math.min(days, 14) - d}`, sessions: Math.max(0, Math.round((sess / Math.max(1, Math.min(days, 14))) * (0.6 + 0.8 * ((i + d) % 4) / 3))) });
          }
          const routes = routesMap[portal] || ["/" + portal + "/inicio", "/" + portal + "/detalle", "/" + portal + "/reportes"];
          const topPages = [
            { path: routes[0], hits: Math.round(pv * 0.48) },
            { path: routes[1], hits: Math.round(pv * 0.32) },
            { path: routes[2] || ("/" + portal + "/ayuda"), hits: Math.round(pv * 0.20) }
          ];

          const item = {
            user_id: code,
            portal: portal,
            sessions: sess,
            page_views: pv,
            last_activity: rel,
            last_activity_seconds: secs,
            trend_pct: Math.abs(diff),
            trend_direction: diff > 0 ? "up" : (diff < 0 ? "down" : "same"),
            primary_device: devicesList[i % devicesList.length],
            primary_browser: browsersList[i % browsersList.length],
            timeline: timeline,
            top_pages: topPages,
            privacy_k_compliant: true
          };

          if (term) {
            const t = term.toLowerCase().trim();
            if (!item.user_id.toLowerCase().includes(t) && !item.portal.toLowerCase().includes(t)) continue;
          }
          res.push(item);
        }
        return res;
      };

      // Cargar actividad de usuarios
      const loadUsers = async () => {
        setIsSyncing(true);
        try {
          const query = new URLSearchParams({
            days: timeRange,
            limit: 50
          });
          if (portalFilter && portalFilter !== "todos") query.append("app_id", portalFilter);
          if (searchTerm) query.append("search", searchTerm);

          const res = await fetch(`${API_BASE}/api/v1/metrics/users/activity?${query.toString()}`, {
            headers: getHeaders ? getHeaders() : { "Content-Type": "application/json" }
          });
          if (res.ok) {
            const data = await res.json();
            if (data.users && data.users.length > 0) {
              setUsers(data.users);
              setLastSync(new Date().toLocaleTimeString());
              setIsSyncing(false);
              return;
            }
          }
        } catch (err) {
          // Usar generador fallback
        }
        const fallback = generateFallbackUsers(portalFilter, timeRange, searchTerm);
        setUsers(fallback);
        setLastSync(new Date().toLocaleTimeString());
        setIsSyncing(false);
      };

      // Polling periódico cada 20 segundos y al cambiar filtros
      useEffect(() => {
        loadUsers();
        const interval = setInterval(loadUsers, 20000);
        return () => clearInterval(interval);
      }, [portalFilter, timeRange, searchTerm]);

      // Gráfica de Drill-down
      useEffect(() => {
        if (!selectedUser || !drillChartRef.current) return;
        if (drillChartInstance.current) {
          drillChartInstance.current.destroy();
          drillChartInstance.current = null;
        }
        const ctx = drillChartRef.current.getContext("2d");
        drillChartInstance.current = new Chart(ctx, {
          type: "line",
          data: {
            labels: (selectedUser.timeline || []).map(t => t.day),
            datasets: [{
              label: "Sesiones",
              data: (selectedUser.timeline || []).map(t => t.sessions),
              borderColor: "#00549E",
              backgroundColor: "rgba(0, 84, 158, 0.12)",
              borderWidth: 2,
              fill: true,
              tension: 0.35,
              pointBackgroundColor: "#00549E",
              pointRadius: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "#1B2A41",
                padding: 10,
                titleFont: { family: "Inter", size: 11, weight: "bold" },
                bodyFont: { family: "Inter", size: 12 }
              }
            },
            scales: {
              y: { beginAtZero: true, grid: { color: "rgba(100, 116, 139, 0.1)" }, ticks: { precision: 0 } },
              x: { grid: { display: false }, ticks: { font: { size: 10 } } }
            }
          }
        });

        return () => {
          if (drillChartInstance.current) {
            drillChartInstance.current.destroy();
            drillChartInstance.current = null;
          }
        };
      }, [selectedUser]);

      // Ordenamiento de tabla
      const sortedUsers = useMemo(() => {
        const copy = [...users];
        copy.sort((a, b) => {
          let vA = a[sortCol];
          let vB = b[sortCol];
          if (typeof vA === "string") {
            return sortDir === "asc" ? vA.localeCompare(vB) : vB.localeCompare(vA);
          }
          return sortDir === "asc" ? (vA - vB) : (vB - vA);
        });
        return copy;
      }, [users, sortCol, sortDir]);

      const handleSort = (col) => {
        if (sortCol === col) {
          setSortDir(sortDir === "asc" ? "desc" : "asc");
        } else {
          setSortCol(col);
          setSortDir("desc");
        }
      };

      const renderSortIndicator = (col) => {
        if (sortCol !== col) return e("span", { className: "text-gray-300 dark:text-gray-600 ml-1 text-[10px]" }, "⇅");
        return sortDir === "asc"
          ? e("span", { className: "text-[#00549E] dark:text-blue-400 ml-1 text-[10px]" }, "▲")
          : e("span", { className: "text-[#00549E] dark:text-blue-400 ml-1 text-[10px]" }, "▼");
      };

      return e("div", { className: "space-y-4" },
        // Barra de Controles y Filtros
        e("div", { className: "card-onest p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4" },
          // Búsqueda interactiva
          e("div", { className: "relative w-full md:w-80" },
            e("div", { className: "absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400" },
              e(Icons.Search)
            ),
            e("input", {
              type: "text",
              value: searchTerm,
              onChange: (ev) => setSearchTerm(ev.target.value),
              placeholder: "Buscar identificador USR-XXXX o portal...",
              className: "w-full pl-9 pr-3 py-2 text-xs border border-[#CBD5E1] dark:border-[#2D3E59] bg-white dark:bg-[#132034] text-gray-900 dark:text-white rounded-lg focus:outline-none focus:border-[#00549E]"
            })
          ),

          // Selector de Portal + Indicador de Auto-sync
          e("div", { className: "flex flex-wrap items-center gap-3 w-full md:w-auto justify-between md:justify-end" },
            e("div", { className: "flex items-center space-x-2 text-xs" },
              e("span", { className: "text-gray-500 dark:text-gray-400 font-medium" }, "Portal:"),
              e("select", {
                value: portalFilter,
                onChange: (ev) => setPortalFilter(ev.target.value),
                className: "text-xs border border-[#CBD5E1] dark:border-[#2D3E59] rounded-lg px-2.5 py-1.5 bg-white dark:bg-[#132034] text-gray-700 dark:text-gray-200 font-semibold focus:outline-none"
              },
                e("option", { value: "todos" }, "Todos los portales web"),
                (ranking || []).map(r =>
                  e("option", { key: r.app_id, value: r.app_id }, r.app_id)
                )
              )

            // Badge de Auto-sync y botón de refresco manual

    function LiveTelemetryTab({ events, isLiveStreaming, onToggleStream, filter, onFilterChange, onRefresh }) {
      const filteredEvents = useMemo(() => {
        if (filter === "todos") return events;
        return events.filter(e => e.event_type === filter || e.app_id === filter);
      }, [events, filter]);

      return e("div", { className: "space-y-4" },
        // Controles de Streaming
        e("div", { className: "card-onest p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3" },
          e("div", { className: "flex items-center space-x-3" },
            e("span", { className: isLiveStreaming ? "pulse-dot" : "w-2.5 h-2.5 rounded-full bg-gray-400" }),
            e("div", null,
              e("h3", { className: "text-sm font-bold text-[#003E75] dark:text-blue-300 font-heading" }, "Flujo de Eventos Canónicos en Vivo"),
              e("p", { className: "text-xs text-gray-500 dark:text-gray-400" }, "Eventos ingestados por Collector y encolados en RabbitMQ sin datos PII")
            )
          ),
          e("div", { className: "flex items-center space-x-2" },
            e("select", {
              value: filter,
              onChange: (e) => onFilterChange(e.target.value),
              className: "text-xs border border-[#CBD5E1] dark:border-[#2D3E59] rounded-lg px-3 py-1.5 bg-white dark:bg-[#132034] text-gray-700 dark:text-gray-200 font-medium focus:outline-none"
            },
              e("option", { value: "todos" }, "Todos los eventos"),
              e("option", { value: "page_view" }, "Solo Vistas de Página"),
              e("option", { value: "error" }, "Solo Errores"),
              e("option", { value: "portal-clientes" }, "Portal Clientes"),
              e("option", { value: "portal-proveedores" }, "Portal Proveedores"),
              e("option", { value: "portal-colaborador" }, "Portal Colaborador")
            ),
            e("button", {
              onClick: onToggleStream,
              className: `text-xs px-3 py-1.5 rounded-lg font-bold transition ${
                isLiveStreaming ? "bg-amber-100 text-amber-800 dark:bg-amber-950/40 dark:text-amber-300 border border-amber-200" : "bg-green-100 text-green-800 dark:bg-green-950/40 dark:text-green-300 border border-green-200"
              }`
            }, isLiveStreaming ? "Pausar Feed" : "Reanudar Feed"),
            e("button", {
              onClick: onRefresh,
              className: "p-1.5 border border-[#CBD5E1] dark:border-[#2D3E59] bg-white dark:bg-[#132034] rounded-lg hover:bg-gray-50 text-gray-600 dark:text-gray-300"
            }, e(Icons.Refresh))
          )
        ),

        // Lista de Eventos en Tiempo Real
        e("div", { className: "card-onest overflow-hidden" },
          e("div", { className: "overflow-x-auto" },
            e("table", { className: "w-full text-left text-xs" },
              e("thead", { className: "bg-[#F8FAFC] dark:bg-[#132034] font-bold text-[#475467] dark:text-gray-300 border-b border-[#E1E6EB] dark:border-[#2D3E59]" },
                e("tr", null,
                  e("th", { className: "px-4 py-3 font-heading" }, "Timestamp"),
                  e("th", { className: "px-4 py-3 font-heading" }, "Tipo"),
                  e("th", { className: "px-4 py-3 font-heading" }, "Sistema"),
                  e("th", { className: "px-4 py-3 font-heading" }, "Ruta"),
                  e("th", { className: "px-4 py-3 font-heading" }, "User Hash Pseudonimizado"),
                  e("th", { className: "px-4 py-3 font-heading" }, "Dispositivo"),
                  e("th", { className: "px-4 py-3 font-heading" }, "Latencia"),
                  e("th", { className: "px-4 py-3 text-right font-heading" }, "HTTP")
                )
              ),
              e("tbody", { className: "divide-y divide-[#E1E6EB] dark:divide-[#2D3E59] font-mono tabular-nums" },
                filteredEvents.map(evt =>
                  e("tr", { key: evt.event_id, className: "hover:bg-[#F8FAFC] dark:hover:bg-white/5 transition" },
                    e("td", { className: "px-4 py-2.5 text-gray-500 dark:text-gray-400 font-semibold" }, evt.timestamp),
                    e("td", { className: "px-4 py-2.5" },
                      e("span", { className: `px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                        evt.event_type === 'error' ? 'bg-red-100 text-red-800 dark:bg-red-950/40 dark:text-red-300' : 'bg-blue-100 text-blue-800 dark:bg-blue-950/40 dark:text-blue-300'
                      }` }, evt.event_type)
                    ),
                    e("td", { className: "px-4 py-2.5 font-sans font-semibold text-[#003E75] dark:text-blue-300" }, evt.app_id),
                    e("td", { className: "px-4 py-2.5 text-gray-700 dark:text-gray-300 font-mono" }, evt.path),
                    e("td", { className: "px-4 py-2.5 text-gray-400 font-mono" }, evt.pseudonymized_user_hash),
                    e("td", { className: "px-4 py-2.5 font-sans text-gray-600 dark:text-gray-400" }, evt.device),
                    e("td", { className: "px-4 py-2.5 text-gray-700 dark:text-gray-300" }, `${evt.latency_ms} ms`),
                    e("td", { className: "px-4 py-2.5 text-right font-bold" },
                      e("span", { className: evt.status_code === 200 ? 'text-green-600 dark:text-green-400' : 'text-red-600' }, evt.status_code)
                    )
                  )
                )
              )
            )
          )
        )
      );
    }

    // ==========================================
    // 5. PESTAÑA: RENDIMIENTO TÉCNICO & SLA
    // ==========================================
    function PerformanceTab({ techPerf, funnels }) {
      const p = techPerf || {
        global_percentiles: { p50_latency_ms: 285, p90_latency_ms: 580, p99_latency_ms: 1120 },
        core_web_vitals: {
          lcp: { value: "1.35s", rating: "GOOD", target: "< 2.5s" },
          inp: { value: "42ms", rating: "GOOD", target: "< 200ms" },
          cls: { value: "0.015", rating: "GOOD", target: "< 0.10" },
          fid: { value: "18ms", rating: "GOOD", target: "< 100ms" }
        },
        sla_availability: { current_month_pct: 99.96, target_pct: 99.90, total_downtime_minutes_30d: 12.4 },
        infrastructure: { ingestion_rate_events_per_sec: 145.2, compression_ratio: "4.8x", queue_lag_messages: 0 }
      };

      return e("div", { className: "space-y-6" },
        // SLA y Percentiles de Latencia
        e("div", { className: "grid grid-cols-1 md:grid-cols-3 gap-4" },
          e("div", { className: "card-onest p-5 border-l-4 border-l-[#39B54A]" },
            e("div", { className: "text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider font-heading" }, "Disponibilidad Mensual (SLA)"),
            e("div", { className: "text-3xl font-black text-[#2B9138] dark:text-green-400 mt-2 font-heading tabular-nums" }, `${p.sla_availability?.current_month_pct}%`),
            e("div", { className: "text-xs text-gray-500 dark:text-gray-400 mt-2 flex justify-between" },
              e("span", null, `Objetivo: ${p.sla_availability?.target_pct}%`),
              e("span", { className: "font-semibold text-green-700 dark:text-green-400" }, "Cumpliendo SLA")
            )
          ),
          e("div", { className: "card-onest p-5" },
            e("div", { className: "text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider font-heading" }, "Latencia P50 / P90 / P99"),
            e("div", { className: "flex items-baseline space-x-2 mt-2" },
              e("span", { className: "text-3xl font-black text-[#003E75] dark:text-blue-400 font-heading tabular-nums" }, `${p.global_percentiles?.p50_latency_ms}`),
              e("span", { className: "text-xs text-gray-400 font-mono" }, `ms (P50) • P99: ${p.global_percentiles?.p99_latency_ms} ms`)
            ),
            e("div", { className: "text-xs text-gray-500 dark:text-gray-400 mt-2" }, "Mediana de respuesta en servidores de borde")
          ),
          e("div", { className: "card-onest p-5" },
            e("div", { className: "text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider font-heading" }, "Rendimiento de Ingesta"),
            e("div", { className: "text-3xl font-black text-gray-900 dark:text-white mt-2 font-heading tabular-nums" }, `${p.infrastructure?.ingestion_rate_events_per_sec}`),
            e("div", { className: "text-xs text-gray-500 dark:text-gray-400 mt-2 flex justify-between font-mono" },
              e("span", null, "eventos/segundo"),
              e("span", { className: "text-[#39B54A] font-bold" }, `0 lag cola`)
            )
          )
        ),

        // Core Web Vitals
        e("div", { className: "card-onest p-6" },
          e("h3", { className: "text-base font-bold text-[#003E75] dark:text-blue-300 font-heading mb-1" }, "Métricas de Experiencia Web (Core Web Vitals)"),
          e("p", { className: "text-xs text-gray-500 dark:text-gray-400 mb-6" }, "Telemetría real de rendimiento de interfaz medida en clientes finales"),
          e("div", { className: "grid grid-cols-2 sm:grid-cols-4 gap-4" },
            Object.entries(p.core_web_vitals || {}).map(([key, item]) =>
              e("div", { key, className: "p-4 bg-[#F8FAFC] dark:bg-[#132034] border border-[#E1E6EB] dark:border-[#2D3E59] rounded-xl text-center" },
                e("span", { className: "text-xs font-bold text-gray-500 dark:text-gray-400 uppercase font-mono" }, key),
                e("div", { className: "text-2xl font-black text-[#003E75] dark:text-blue-300 mt-1 font-heading tabular-nums" }, item.value),
                e("span", { className: "inline-block mt-2 text-[10px] font-bold px-2 py-0.5 rounded bg-green-100 dark:bg-green-950/40 text-green-800 dark:text-green-300" }, item.rating),
                e("div", { className: "text-[10px] text-gray-400 mt-1 font-mono" }, `Meta: ${item.target}`)
              )
            )
          )
        ),

        // Funnels de Adopción y Flujos Críticos
        e("div", { className: "card-onest p-6" },
          e("h3", { className: "text-base font-bold text-[#003E75] dark:text-blue-300 font-heading mb-1" }, "Funnels de Proceso & Abandono en Flujos Críticos"),
          e("p", { className: "text-xs text-gray-500 dark:text-gray-400 mb-6" }, "Seguimiento de finalización de flujos y tareas en Portales Web Corporativos"),
          e("div", { className: "space-y-6" },
            (funnels || []).map(funnel =>
              e("div", { key: funnel.funnel_id, className: "border border-[#E1E6EB] dark:border-[#2D3E59] rounded-xl p-4 bg-white dark:bg-[#132034]" },
                e("div", { className: "flex justify-between items-center mb-3" },
                  e("div", null,
                    e("h4", { className: "text-sm font-bold text-[#003E75] dark:text-blue-300 font-heading" }, funnel.title),
                    e("span", { className: "text-xs text-gray-500 dark:text-gray-400" }, `${funnel.system} • Conversión Global: `),
                    e("span", { className: "text-xs font-bold text-green-700 dark:text-green-400" }, `${funnel.overall_conversion_pct}%`)
                  ),
                  e("span", { className: "text-xs font-mono text-gray-400" }, `${funnel.total_completed?.toLocaleString()} / ${funnel.total_started?.toLocaleString()} completados`)
                ),
                e("div", { className: "grid grid-cols-1 sm:grid-cols-4 gap-2" },
                  funnel.steps.map(st =>
                    e("div", { key: st.step_num, className: "p-3 bg-[#F8FAFC] dark:bg-[#1B2A41] border border-[#E1E6EB] dark:border-[#2D3E59] rounded-lg relative" },
                      e("div", { className: "text-[10px] font-bold text-[#00549E] dark:text-blue-400 uppercase" }, `Paso ${st.step_num}`),
                      e("div", { className: "text-xs font-semibold text-gray-800 dark:text-gray-200 mt-1 truncate", title: st.name }, st.name),
                      e("div", { className: "flex justify-between items-baseline mt-2 font-mono" },
                        e("span", { className: "text-sm font-bold text-[#003E75] dark:text-blue-300" }, `${st.conversion_pct}%`),
                        st.dropoff_pct > 0 && e("span", { className: "text-[10px] text-red-600 font-semibold" }, `-${st.dropoff_pct}%`)
                      )
                    )
                  )
                )
              )
            )
          )
        )
      );
    }

    // ==========================================
    // 6. PESTAÑA: GOBERNANZA Y PRIVACIDAD (ADMIN)
    // ==========================================
    function GovernanceTab({ governanceData, ranking, idleMetrics }) {
      const gov = governanceData?.privacy_policy || {
        pseudonymization: "HMAC-SHA256 at edge (Collector)",
        reverse_mapping_storage: "NONE (prohibido por diseño)",
        minimum_k_threshold: 5,
        raw_events_retention_days: 90,
        prohibited_attributes: ["passwords", "form_inputs", "tokens", "free_text", "pii"]
      };

      return e("div", { className: "space-y-6" },
        // Encabezado de Cumplimiento
        e("div", { className: "card-onest p-6 border-l-4 border-l-[#39B54A]" },
          e("div", { className: "flex items-center space-x-3" },
            e("div", { className: "p-2 bg-green-100 dark:bg-green-950/40 rounded-lg text-green-700 dark:text-green-400" }, e(Icons.ShieldCheck)),
            e("div", null,
              e("h3", { className: "text-base font-bold text-[#003E75] dark:text-blue-300 font-heading" }, "Gobernanza de Privacidad y Cumplimiento Normativo"),
              e("p", { className: "text-xs text-gray-500 dark:text-gray-400 mt-0.5" }, "Verificación activa de Privacy by Design y control del umbral k-anonymity (k ≥ 5)")
            )
          )
        ),

        // Matriz de Políticas Técnicas
        e("div", { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
          e("div", { className: "card-onest p-5" },
            e("h4", { className: "text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3 font-heading" }, "Políticas Criptográficas y de Ingesta"),
            e("div", { className: "space-y-2.5 text-xs" },
              e("div", { className: "flex justify-between py-1 border-b border-gray-100 dark:border-gray-700" },
                e("span", { className: "text-gray-600 dark:text-gray-400" }, "Algoritmo de Pseudonimización:"),
                e("span", { className: "font-mono font-bold text-[#003E75] dark:text-blue-300" }, gov.pseudonymization)
              ),
              e("div", { className: "flex justify-between py-1 border-b border-gray-100 dark:border-gray-700" },
                e("span", { className: "text-gray-600 dark:text-gray-400" }, "Almacenamiento de Tabla Inversa:"),
                e("span", { className: "font-mono font-bold text-red-600" }, gov.reverse_mapping_storage)
              ),
              e("div", { className: "flex justify-between py-1 border-b border-gray-100 dark:border-gray-700" },
                e("span", { className: "text-gray-600 dark:text-gray-400" }, "Umbral Mínimo de k-anonimato:"),
                e("span", { className: "font-mono font-bold text-green-700 dark:text-green-400" }, `k ≥ ${gov.minimum_k_threshold} usuarios`)
              ),
              e("div", { className: "flex justify-between py-1" },
                e("span", { className: "text-gray-600 dark:text-gray-400" }, "Retención de Eventos (TTL ClickHouse):"),
                e("span", { className: "font-mono font-bold text-gray-800 dark:text-gray-200" }, `${gov.raw_events_retention_days} días`)
              )
            )
          ),

          e("div", { className: "card-onest p-5" },
            e("h4", { className: "text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3 font-heading" }, "Atributos Prohibidos por Diseño"),
            e("p", { className: "text-xs text-gray-500 dark:text-gray-400 mb-3" }, "Los siguientes campos son rechazados y purgados en el Collector:"),
            e("div", { className: "flex flex-wrap gap-2" },
              (gov.prohibited_attributes || []).map(attr =>
                e("span", { key: attr, className: "bg-red-50 dark:bg-red-950/40 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800 text-xs px-2.5 py-1 rounded font-mono font-semibold" },
                  `🚫 ${attr}`
                )
              )
            )
          )
        ),

        // Eficiencia y Gobernanza de Cuentas Inactivas (>30 días) - REQUERIMIENTO E
        e("div", { className: "card-onest p-6" },
          e("div", { className: "flex justify-between items-start mb-4" },
            e("div", null,
              e("h4", { className: "text-sm font-bold text-[#003E75] dark:text-blue-300 font-heading" },
                "Gobernanza de Cuentas Inactivas & Eficiencia de Licencias (>30 días)"
              ),
              e("p", { className: "text-xs text-gray-500 dark:text-gray-400 mt-0.5" },
                "Detección de cuentas sin actividad para reasignación y optimización de licencias en portales corporativos"
              )
            ),
            e("span", { className: "text-xs font-mono px-2 py-0.5 rounded bg-blue-50 dark:bg-blue-900/30 text-[#00549E] dark:text-blue-300 border border-blue-200 dark:border-blue-800" },
              `Umbral: ${idleMetrics?.threshold_days || 30} días`
            )
          ),
          idleMetrics ? e("div", { className: "space-y-4" },
            e("div", { className: "grid grid-cols-1 sm:grid-cols-3 gap-4 text-center" },
              e("div", { className: "bg-[#F8FAFC] dark:bg-[#132034] p-4 rounded-xl border border-[#E1E6EB] dark:border-[#2D3E59]" },
                e("div", { className: "text-xs text-gray-500 dark:text-gray-400" }, "Cohorte Total Registrada"),
                e("div", { className: "text-2xl font-black text-gray-900 dark:text-white mt-1 font-heading tabular-nums" },
                  idleMetrics.total_registered_cohort?.toLocaleString()
                ),
                e("div", { className: "text-[11px] text-gray-400 mt-0.5 font-mono" }, "usuarios únicos")
              ),
              e("div", { className: "bg-[#EAF7EC] dark:bg-green-950/30 p-4 rounded-xl border border-[#BBF7D0] dark:border-green-800" },
                e("div", { className: "text-xs text-green-800 dark:text-green-300 font-semibold" }, "Cuentas en Activo"),
                e("div", { className: "text-2xl font-black text-[#2B9138] dark:text-green-400 mt-1 font-heading tabular-nums" },
                  `${idleMetrics.active_percentage}%`
                ),
                e("div", { className: "text-[11px] text-green-700 dark:text-green-300 mt-0.5 font-mono" },
                  `${idleMetrics.active_users_count?.toLocaleString()} usuarios activos`
                )
              ),
              e("div", { className: "bg-amber-50 dark:bg-amber-950/30 p-4 rounded-xl border border-amber-200 dark:border-amber-800" },
                e("div", { className: "text-xs text-amber-800 dark:text-amber-300 font-semibold" }, "Cuentas Ociosas (>30d)"),
                e("div", { className: "text-2xl font-black text-amber-700 dark:text-amber-400 mt-1 font-heading tabular-nums" },
                  `${idleMetrics.idle_percentage}%`
                ),
                e("div", { className: "text-[11px] text-amber-700 dark:text-amber-300 mt-0.5 font-mono" },
                  `${idleMetrics.idle_users_count?.toLocaleString()} licencias liberables`
                )
              )
            ),
            e("div", { className: "space-y-1.5" },
              e("div", { className: "flex justify-between text-xs text-gray-600 dark:text-gray-300 font-medium" },
                e("span", null, `Eficiencia Operativa: ${idleMetrics.active_percentage}%`),
                e("span", null, `Ociosidad de Acceso: ${idleMetrics.idle_percentage}%`)
              ),
              e("div", { className: "w-full h-3 bg-amber-200 dark:bg-amber-950 rounded-full overflow-hidden flex" },
                e("div", {
                  className: "bg-[#00549E] dark:bg-[#1677BD] h-full transition-all duration-500",
                  style: { width: `${idleMetrics.active_percentage}%` },
                  title: `Activas: ${idleMetrics.active_percentage}%`
                }),
                e("div", {
                  className: "bg-amber-500 h-full transition-all duration-500",
                  style: { width: `${idleMetrics.idle_percentage}%` },
                  title: `Ociosas: ${idleMetrics.idle_percentage}%`
                })
              )
            )
          ) : e("div", { className: "text-xs text-gray-400 py-4 text-center" }, "Cargando métricas de gobernanza de cuentas...")
        ),

        // Auditoría de Supresión de k-Anonimato en Vivo
        e("div", { className: "card-onest p-6" },
          e("h4", { className: "text-sm font-bold text-[#003E75] dark:text-blue-300 font-heading mb-1" }, "Auditoría de Supresión por Umbral k < 5"),
          e("p", { className: "text-xs text-gray-500 dark:text-gray-400 mb-4" },
            "Las consultas con cohortes menores a 5 usuarios son censuradas automáticamente en la capa de agregación para evitar reidentificación."
          ),
          e("div", { className: "space-y-3" },
            ranking.filter(r => r.privacy_suppressed || r.unique_users < 5).map(item =>
              e("div", { key: item.app_id, className: "p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 rounded-lg flex items-center justify-between" },
                e("div", null,
                  e("div", { className: "text-xs font-bold text-amber-900 dark:text-amber-200 font-heading" }, `Portal: ${item.app_id}`),
                  e("div", { className: "text-[11px] text-amber-700 dark:text-amber-300" }, "Acción: Métricas agregadas suprimidas (valores retornados como null)")
                ),
                e("span", { className: "bg-amber-200 dark:bg-amber-900 text-amber-900 dark:text-amber-200 text-xs font-mono font-bold px-2 py-0.5 rounded" },
                  "privacy_suppressed: true"
                )
              )
            )
          )
        )
      );
    }

    // Montar la aplicación React en el DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(e(App));
  </script>
</body>
</html>
