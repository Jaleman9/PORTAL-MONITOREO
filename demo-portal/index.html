<!DOCTYPE html>
<html lang="es" data-brand="onest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONEST Digital - Suite de 11 Portales Corporativos & Telemetría UX</title>
  
  <!-- Google Fonts: Montserrat (600/700/800) & Inter (400/500/600/700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            onest: {
              blue: {
                950: "#001F3D",
                900: "#003E75",
                800: "#004686",
                700: "#00549E",
                600: "#0A6CBE",
                500: "#1677BD",
                400: "#3893D2",
                300: "#4FA8E0",
                200: "#A9D3EF",
                100: "#EAF3FA",
                50:  "#F5FAFD",
              },
              gray: {
                950: "#20252B",
                700: "#475467",
                500: "#667085",
                300: "#D0D5DD",
                200: "#E1E6EB",
                100: "#F2F4F7",
                50:  "#F8FAFC",
              }
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            heading: ['Montserrat', 'Arial', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- Inclusión del SDK Web de telemetría corporativa -->
  <script src="/sdk/telemetry.js"></script>

  <style>
    html[data-brand="onest"], :root {
      --onest-blue-950: #001F3D;
      --onest-blue-900: #003E75;
      --onest-blue-800: #004686;
      --onest-blue-700: #00549E;
      --onest-blue-600: #0A6CBE;
      --onest-blue-500: #1677BD;
      --onest-blue-400: #3893D2;
      --onest-blue-300: #4FA8E0;
      --onest-blue-200: #A9D3EF;
      --onest-blue-100: #EAF3FA;
      --onest-blue-50:  #F5FAFD;

      --onest-gray-950: #20252B;
      --onest-gray-700: #475467;
      --onest-gray-500: #667085;
      --onest-gray-300: #D0D5DD;
      --onest-gray-200: #E1E6EB;
      --onest-gray-100: #F2F4F7;
      --onest-gray-50:  #F8FAFC;

      --onest-radius-sm: 6px;
      --onest-radius-md: 8px;
      --onest-radius-lg: 12px;
      --onest-radius-xl: 18px;

      --onest-shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
      --onest-shadow-md: 0 6px 16px rgba(0, 62, 117, .10);
      --onest-shadow-lg: 0 16px 40px rgba(0, 62, 117, .18);

      --onest-ease: cubic-bezier(.2, .7, .3, 1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--onest-gray-50);
      color: var(--onest-gray-950);
      margin: 0;
      padding: 0;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 700;
    }

    .card-onest {
      background: #FFFFFF;
      border: 1px solid var(--onest-gray-200);
      border-radius: var(--onest-radius-lg);
      padding: 20px;
      box-shadow: var(--onest-shadow-sm);
      transition: all 0.2s var(--onest-ease);
    }
    .card-onest:hover {
      border-color: var(--onest-blue-200);
      box-shadow: var(--onest-shadow-md);
    }

    .input-onest {
      height: 40px;
      padding: 0 14px;
      background: #FFFFFF;
      border: 1px solid var(--onest-gray-300);
      border-radius: var(--onest-radius-md);
      font-size: 13px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-onest:focus {
      outline: none;
      border-color: var(--onest-blue-600);
      box-shadow: 0 0 0 3px rgba(10, 108, 190, 0.15);
    }

    .btn-primary {
      height: 38px;
      padding: 0 16px;
      background: var(--onest-blue-700);
      color: #FFFFFF;
      border: none;
      border-radius: var(--onest-radius-md);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s var(--onest-ease);
    }
    .btn-primary:hover {
      background: var(--onest-blue-500);
    }

    .btn-secondary {
      height: 38px;
      padding: 0 14px;
      background: #FFFFFF;
      color: var(--onest-blue-700);
      border: 1px solid var(--onest-gray-300);
      border-radius: var(--onest-radius-md);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s var(--onest-ease);
    }
    .btn-secondary:hover {
      background: var(--onest-blue-50);
      border-color: var(--onest-blue-400);
    }

    .app-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--onest-radius-md);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s var(--onest-ease);
      border: 1px solid var(--onest-gray-200);
      background: #FFFFFF;
      color: var(--onest-gray-700);
      cursor: pointer;
    }
    .app-pill.active {
      background: var(--onest-blue-700);
      color: #FFFFFF;
      border-color: var(--onest-blue-800);
      box-shadow: var(--onest-shadow-sm);
    }
    .app-pill:not(.active):hover {
      background: var(--onest-blue-50);
      color: var(--onest-blue-700);
      border-color: var(--onest-blue-300);
    }

    .page-banner {
      position: relative;
      min-height: 140px;
      border-radius: var(--onest-radius-lg);
      overflow: hidden;
      background-size: cover;
      background-position: center;
      box-shadow: var(--onest-shadow-md);
    }
    .page-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg,
          rgba(0, 20, 40, .94) 0%, rgba(0, 31, 61, .84) 38%,
          rgba(0, 31, 61, .45) 72%, rgba(0, 31, 61, .15) 100%);
      z-index: 1;
    }
    .page-banner-content {
      position: relative;
      z-index: 2;
      padding: 1.5rem 2rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#F8FAFC]">

  <!-- Header Superior -->
  <header class="h-16 bg-white border-b border-[#E1E6EB] px-4 lg:px-8 flex items-center justify-between sticky top-0 z-30 shadow-sm">
    <div class="flex items-center gap-4">
      <a href="/" class="flex items-center gap-2 group">
        <span class="font-heading font-black text-2xl tracking-tighter text-[#003E75] group-hover:text-[#0A6CBE] transition">ONEST</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-[#EAF3FA] text-[#0A6CBE] border border-[#A9D3EF]">SMARTLOGISTICS</span>
      </a>
      <span class="h-5 w-px bg-[#E1E6EB] hidden sm:block"></span>
      <div class="hidden sm:block">
        <h1 id="header-app-title" class="font-heading text-sm font-bold text-[#20252B]">Suite de 11 Portales Corporativos</h1>
        <p class="text-[11px] text-[#667085]">Telemetría y Reproducción de Sesiones en Vivo</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <!-- Indicador Sesión Grabada -->
      <div id="session-recording-badge" class="flex items-center gap-2 px-3 py-1 bg-red-50 text-red-700 border border-red-200 rounded-full text-xs font-mono font-bold shadow-xs">
        <span class="w-2 h-2 rounded-full bg-red-600 animate-ping"></span>
        <span id="or-status-text">Grabación de Sesión: Activa</span>
      </div>

      <a href="/" class="btn-secondary !h-9 text-xs flex items-center gap-1.5">
        <span>←</span>
        <span>Dashboard Central</span>
      </a>
    </div>
  </header>

  <!-- Barra de Selección de los 11 Portales -->
  <section class="bg-white border-b border-[#E1E6EB] px-4 lg:px-8 py-3 shadow-[0_2px_4px_rgba(0,0,0,0.02)] sticky top-16 z-20 overflow-x-auto">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1" id="portal-pills-container">
        <!-- Generado dinámicamente con JS -->
      </div>
    </div>
  </section>

  <!-- Contenedor Principal de la App Activa -->
  <main class="flex-1 max-w-7xl mx-auto w-full p-4 lg:p-8 space-y-6">
    <div id="app-dynamic-view" class="space-y-6">
      <!-- Inyectado dinámicamente según la app seleccionada -->
    </div>
  </main>

  <!-- Widget Flotante de Telemetry Tracker -->
  <div id="openreplay-floating-widget" class="fixed bottom-4 right-4 z-50 bg-[#001F3D] text-white p-3.5 rounded-xl border border-blue-800 shadow-2xl text-xs font-mono space-y-2 max-w-xs transition-all">
    <div class="flex items-center justify-between pb-1.5 border-b border-blue-900">
      <div class="flex items-center space-x-1.5">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
        <span class="font-bold text-[#A9D3EF]">Telemetría UX</span>
      </div>
      <span class="text-[10px] bg-blue-900 text-blue-300 px-1.5 py-0.2 rounded">Zero-PII</span>
    </div>
    <div class="grid grid-cols-2 gap-2 text-[11px]">
      <div>
        <span class="text-gray-400">Tiempo Activo:</span>
        <div id="or-active-timer" class="font-bold text-emerald-400 text-sm">0s</div>
      </div>
      <div>
        <span class="text-gray-400">Tiempo Inactivo:</span>
        <div id="or-idle-timer" class="font-bold text-amber-400 text-sm">0s</div>
      </div>
    </div>
    <div class="flex items-center justify-between text-[10px] text-gray-400 pt-1 border-t border-blue-900">
      <span>Rage Clicks: <strong id="or-rage-count" class="text-red-400">0</strong></span>
      <span class="text-blue-300">k ≥ 5 Conforme</span>
    </div>
  </div>

  <script>
    // Catálogo Maestro de los 11 Portales
    const PORTALS = [
      { id: "drive", app_id: "drive-onest", badge: "FLUJO", title: "Drive Onest", icon: "📁", sub: "Gestión Documental" },
      { id: "capacitacion", app_id: "portal-capacitacion", badge: "APRENDER", title: "Portal de Capacitación", icon: "📖", sub: "Academia Virtual" },
      { id: "crm", app_id: "crm-ventas", badge: "CONECTAR", title: "CRM", icon: "💬", sub: "Ventas & Pipeline" },
      { id: "slotting", app_id: "slotting-onest", badge: "ORDENAR", title: "Slotting Onest", icon: "⊞", sub: "Racks & WMS" },
      { id: "lili", app_id: "portal-lili", badge: "PERSONAS", title: "Portal Lili", icon: "👤", sub: "Autoservicio Colaborador" },
      { id: "salud", app_id: "portal-salud", badge: "BIENESTAR", title: "Portal de Salud", icon: "🤍", sub: "Ergonomía & Medicina" },
      { id: "contratistas", app_id: "portal-contratistas", badge: "SEGURIDAD", title: "Portal de Contratistas", icon: "⛑️", sub: "Acceso Cedis & SUA" },
      { id: "predios", app_id: "portal-predios", badge: "UBICACIÓN", title: "Portal de Predios", icon: "🏢", sub: "Naves & Facilities" },
      { id: "tickets", app_id: "portal-tickets", badge: "ATENCIÓN", title: "Portal de Tickets", icon: "🎫", sub: "Mesa de Ayuda TI" },
      { id: "reclutamiento", app_id: "portal-reclutamiento", badge: "TALENTO", title: "Portal de Reclutamiento", icon: "👥", sub: "Atracción & Vacantes" },
      { id: "dc3", app_id: "dc3-certificar", badge: "CERTIFICAR", title: "DC3", icon: "📄", sub: "Certificación STPS" }
    ];

    let currentAppId = "drive";
    let activeSeconds = 0;
    let idleSeconds = 0;
    let isUserActive = true;
    let lastActivityTime = Date.now();
    let rageClickCount = 0;
    let clickTimestamps = [];

    // Detectar inactividad (después de 3s sin interacción)
    function onUserInteraction() {
      lastActivityTime = Date.now();
      isUserActive = true;
    }

    window.addEventListener("mousemove", onUserInteraction);
    window.addEventListener("keydown", onUserInteraction);
    window.addEventListener("scroll", onUserInteraction);

    // Detección de Rage Clicks (3+ clics rápidos en < 1 segundo)
    window.addEventListener("click", (e) => {
      onUserInteraction();
      const now = Date.now();
      clickTimestamps.push(now);
      clickTimestamps = clickTimestamps.filter(t => now - t <= 1000);
      if (clickTimestamps.length >= 3) {
        rageClickCount++;
        document.getElementById("or-rage-count").textContent = rageClickCount;
        showToast("⚠️ Rage Click detectado y registrado", "warning");
        if (window.OnestTelemetry) {
          window.OnestTelemetry.trackEvent("rage_click", { element: e.target.tagName, count: rageClickCount });
        }
      }
    });

    // Cronómetro de telemetría segundo a segundo
    setInterval(() => {
      const now = Date.now();
      if (now - lastActivityTime > 3000) {
        isUserActive = false;
        idleSeconds++;
      } else {
        isUserActive = true;
        activeSeconds++;
      }
      document.getElementById("or-active-timer").textContent = `${activeSeconds}s`;
      document.getElementById("or-idle-timer").textContent = `${idleSeconds}s`;
    }, 1000);

    // Toast de notificaciones
    function showToast(msg, type = "info") {
      const t = document.createElement("div");
      t.className = "fixed top-20 right-6 z-50 bg-[#001F3D] text-white px-4 py-2.5 rounded-xl border border-blue-800 shadow-xl text-xs font-semibold animate-bounce";
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // Renderizar Selector de Portales
    function renderPills() {
      const container = document.getElementById("portal-pills-container");
      container.innerHTML = PORTALS.map(p => `
        <button onclick="switchPortal('${p.id}')" class="app-pill ${currentAppId === p.id ? 'active' : ''}">
          <span>${p.icon}</span>
          <span>${p.title}</span>
          <span class="text-[9px] px-1 rounded ${currentAppId === p.id ? 'bg-white/20 text-white' : 'bg-blue-50 text-[#00549E]'}">${p.badge}</span>
        </button>
      `).join("");
    }

    // Cambiar de portal
    function switchPortal(portalId) {
      currentAppId = portalId;
      renderPills();
      const portal = PORTALS.find(p => p.id === portalId);
      if (portal && window.OnestTelemetry) {
        window.OnestTelemetry.trackPageView(`/${portal.app_id}`);
      }
      renderPortalView(portal);
    }

    function renderPortalView(p) {
      const container = document.getElementById("app-dynamic-view");
      document.getElementById("header-app-title").textContent = `${p.title} (${p.badge})`;

      container.innerHTML = `
        <div class="page-banner" style="background-image: url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1600&q=80');">
          <div class="page-banner-content">
            <div class="text-[11px] font-bold tracking-wider text-[#A9D3EF] uppercase flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-blue-300"></span>
              <span>ONEST SMARTLOGISTICS • APP ID: ${p.app_id} • INSIGNIA: ${p.badge}</span>
            </div>
            <h2 class="text-2xl font-bold text-white font-heading mt-1">${p.title} (${p.badge})</h2>
            <p class="text-xs text-blue-100 max-w-2xl mt-1">${p.sub} corporativo con observabilidad y telemetría activa.</p>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="card-onest p-4 border-l-4 border-l-[#00549E]">
            <span class="text-xs font-bold text-gray-500 uppercase">Estado Operativo</span>
            <div class="text-xl font-bold text-[#003E75] mt-1">100% ONLINE</div>
            <span class="text-[11px] text-emerald-600">SLA 99.96% cumplido</span>
          </div>
          <div class="card-onest p-4 border-l-4 border-l-[#0A6CBE]">
            <span class="text-xs font-bold text-gray-500 uppercase">Telemetría UX</span>
            <div class="text-xl font-bold text-[#0A6CBE] mt-1">Instrumentado</div>
            <span class="text-[11px] text-blue-600">Tiempo activo registrado</span>
          </div>
          <div class="card-onest p-4 border-l-4 border-l-amber-500">
            <span class="text-xs font-bold text-gray-500 uppercase">Privacidad</span>
            <div class="text-xl font-bold text-gray-900 mt-1">k ≥ 5 Estricto</div>
            <span class="text-[11px] text-gray-500">Cero PII en logs</span>
          </div>
        </div>

        <div class="card-onest p-6 space-y-4">
          <div class="flex justify-between items-center pb-3 border-b border-gray-200">
            <h3 class="font-heading font-bold text-base text-[#003E75]">Acciones Operativas del Portal</h3>
            <span class="text-xs font-mono text-gray-400">Dispara eventos en vivo</span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <button onclick="triggerAction('Consulta de Datos', '${p.app_id}')" class="btn-primary justify-center">
              🔍 Consultar Registro / Filtrar
            </button>
            <button onclick="triggerAction('Generación de Reporte', '${p.app_id}')" class="btn-secondary justify-center">
              📊 Generar Reporte PDF
            </button>
            <button onclick="triggerAction('Actualización de Estado', '${p.app_id}')" class="btn-primary !bg-[#003E75] justify-center">
              💾 Guardar & Transmitir Telemetría
            </button>
          </div>
        </div>
      `;
    }

    function triggerAction(actionName, appId) {
      showToast(`Evento ejecutado: ${actionName} en ${appId}`);
      if (window.OnestTelemetry) {
        window.OnestTelemetry.trackEvent("user_action", { action: actionName, portal: appId });
      }
    }

    // Inicializar app según URL query param ?app=xxx
    const urlParams = new URLSearchParams(window.location.search);
    const initialApp = urlParams.get("app") || "drive";
    const found = PORTALS.find(p => p.id === initialApp);
    if (found) currentAppId = found.id;

    renderPills();
    renderPortalView(PORTALS.find(p => p.id === currentAppId) || PORTALS[0]);
  </script>
</body>
</html>
